name: Clue (BioWink)
type: Index
kind: company
description: >-
  Clue, operated by BioWink GmbH in Berlin, Germany, is a science-driven
  menstrual, ovulation, pregnancy, and reproductive health tracking app with
  100M+ downloads across 190+ countries. The product portfolio spans Clue
  (free tier), Clue Plus (subscription), Clue Conceive, Clue Pregnancy, Clue
  Perimenopause, and a "Clue (No Period)" mode for non-bleeding hormonal
  cycles. Clue Connect provides partner sharing. The company contributes
  anonymized real-world data to academic research partnerships with Stanford,
  University of Oxford, UC Berkeley, MIT, and the Bill & Melinda Gates
  Foundation. Clue is a consumer mobile product; no public developer API or
  partner API portal has been identified. This entry catalogs the company
  surface for the API Evangelist index.
